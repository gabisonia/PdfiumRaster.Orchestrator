name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
      - release-*
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PdfiumRaster.Orchestrator.slnx --locked-mode

      - name: Test
        run: dotnet test PdfiumRaster.Orchestrator.slnx --configuration Release --no-restore --filter "Category!=Local"

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PdfiumRaster.Orchestrator.slnx --locked-mode

      - name: Enforce coverage
        run: make coverage

      - name: Pack
        run: make pack

      - name: Verify package contents
        run: make verify-package

      - name: Verify slim package RID mismatch diagnostics
        run: make smoke-slim-package-mismatch

      - name: Smoke test netstandard2.1 package consumption
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          dotnet new classlib -n PdfiumRasterOrchestratorCompatibility -o "$tmpdir/compatibility" --framework netstandard2.1
          cd "$tmpdir/compatibility"
          dotnet new nugetconfig --force
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name local --configfile nuget.config
          dotnet add package PdfiumRaster.Orchestrator --version 1.0.0
          dotnet build --configuration Release

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  packaged-worker-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: artifacts

      - name: Smoke test packaged worker
        shell: pwsh
        run: ./eng/SmokePackage.ps1 -RepositoryRoot . -PackageVersion 1.0.0

      - name: Smoke test current-platform slim package
        shell: pwsh
        run: |
          $ridLine = dotnet --info | Select-String -Pattern '^\s*RID:\s+(\S+)' | Select-Object -First 1
          if (-not $ridLine) { throw 'Could not determine the current .NET runtime identifier.' }
          $rid = $ridLine.Matches[0].Groups[1].Value
          ./eng/SmokePackage.ps1 -RepositoryRoot . -PackageVersion 1.0.0 -PackageId "PdfiumRaster.Orchestrator.$rid"
