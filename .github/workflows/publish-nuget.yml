name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - beta
          - stable
      version:
        description: "Package version. Stable example: 1.0.0. Beta input can be 1.0.0-beta.1."
        required: true
        type: string
      nuget_user:
        description: "NuGet.org profile name that owns the trusted publishing policy."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compute package version
        id: version
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          input_version="$INPUT_VERSION"
          channel="$INPUT_CHANNEL"

          if [[ "$channel" == "stable" ]]; then
            if [[ ! "$input_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable releases require a SemVer version such as 1.0.0." >&2
              exit 1
            fi
            package_version="$input_version"
          else
            if [[ "$input_version" =~ - ]]; then
              package_version="$input_version"
            else
              package_version="${input_version}-beta.${GITHUB_RUN_NUMBER}"
            fi

            if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
              echo "Beta releases must resolve to a SemVer prerelease such as 2.1.0-beta.1." >&2
              exit 1
            fi
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PdfiumRaster.Orchestrator.slnx

      - name: Test and enforce coverage
        run: make coverage

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make pack PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Verify package contents
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make verify-package PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Smoke test netstandard2.1 package consumption
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          dotnet new classlib -n PdfiumRasterOrchestratorCompatibility -o "$tmpdir/compatibility" --framework netstandard2.1
          cd "$tmpdir/compatibility"
          dotnet new nugetconfig --force
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name local --configfile nuget.config
          dotnet add package PdfiumRaster.Orchestrator --version "$PACKAGE_VERSION"
          dotnet build --configuration Release

      - name: Smoke test packaged worker
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make smoke-package PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Smoke test slim packaged worker
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make smoke-slim-package PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Verify slim package RID mismatch diagnostics
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: make smoke-slim-package-mismatch PACKAGE_VERSION="$PACKAGE_VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PdfiumRaster.Orchestrator-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ inputs.nuget_user }}

      - name: Publish package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(artifacts/*.nupkg)
          symbols=(artifacts/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No .nupkg files found in artifacts/." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          for symbol_package in "${symbols[@]}"; do
            dotnet nuget push "$symbol_package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
